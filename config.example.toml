[user]
name = "Your Name"
timezone = "America/New_York"

[garmin]
# Run `recovery auth garmin` to authenticate
# Tokens stored in ~/.recovery-bot/garmin_tokens/
email = ""

[strava]
client_id = ""
client_secret = ""
# Run `recovery auth strava` to authenticate (opens browser)
# Token stored in ~/.recovery-bot/strava_token.json

[trendweight]
# Your TrendWeight share URL — find it under Settings > Share on trendweight.com
# e.g. https://trendweight.com/u/<your-id>
share_url = ""

[sync]
sync_time = "08:00"
backfill_days = 730

[knowledge]
# Document knowledge base (PDFs uploaded via the Documents tab → knowledge.db).
# OCR for scanned/image-only pages needs ANTHROPIC_API_KEY in the environment;
# text PDFs need no key. If the key is absent, scanned pages are skipped.
ocr_enabled = true
ocr_model = "claude-haiku-4-5"
max_pdf_mb = 25

[coach]
# Workout generation (Coach tab) calls the Claude API server-side and needs
# ANTHROPIC_API_KEY in the environment.
model = "claude-sonnet-4-6"

[equipment]
sauna = false
squat_rack = false
bench_press = false
dumbbells = false
kettlebells = false
bands = false
pullup_bar = false
barbell = false
cable_machine = false
leg_press = false
treadmill = false
stationary_bike = false
rowing_machine = false
pool = false

[equipment.dumbbell_max_kg]
# Set to your heaviest available dumbbell weight in kg
value = 0

[recovery]
hrv_low_pct = 0.85
hrv_high_pct = 1.10
rhr_high_offset = 5
sleep_min_hours = 7.0
overnight_stress_low = 25
overnight_stress_high = 45

[ui]
port = 8080
default_trend_days = 30
